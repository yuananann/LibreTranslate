services:
  libretranslate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: campusbridge-libretranslate:local
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: "zh,ru,en"
    volumes:
      - campus-models:/home/libretranslate/.local/share/argos-translate
    restart: unless-stopped
volumes:
  campus-models:
